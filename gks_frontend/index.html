<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GKS: personel, vardiya ve puantaj yönetimi için sentetik verili portföy uygulaması." />
    <script>
      // Set the theme before first paint so the page does not flash light.
      try { var t = localStorage.getItem('gks-theme'); } catch (e) {}
      if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    </script>
    <title>GKS — Geçiş Kontrol Sistemi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
