name: Checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            gks_backend/package-lock.json
            gks_frontend/package-lock.json
      - name: Release export isolation and content preflight
        run: |
          node --test scripts/test/*.test.js
          node scripts/prepare-release.js
      - run: npm ci --prefix gks_backend
      - run: npm test --prefix gks_backend
      - run: npm ci --prefix gks_frontend
      - run: npm test --prefix gks_frontend
      - run: npm run lint --prefix gks_frontend
      - run: npm run build --prefix gks_frontend
      - run: npm audit --prefix gks_backend --audit-level=high
      - run: npm audit --prefix gks_frontend --audit-level=high
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fresh ephemeral PostgreSQL. Never uses repository or production secrets.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gks_ci
          POSTGRES_PASSWORD: 'gks-ci-only-disposable'
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=icu --icu-locale=tr-TR
          TZ: Europe/Istanbul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gks_ci -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DB_SERVER: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: gks_ci
      DB_PASSWORD: 'gks-ci-only-disposable'
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gks_backend/package-lock.json
      - run: npm ci --prefix gks_backend
      - name: Wait for PostgreSQL readiness
        run: node gks_backend/scripts/wait-for-db.js
      - name: Fresh schema, migrations, API and demo regressions
        run: npm run test:db --prefix gks_backend
      - name: Build backend and check migration files
        run: |
          docker build -f gks_backend/Dockerfile -t gks-backend:ci .
          docker run --rm --entrypoint node gks-backend:ci -e "require('fs').accessSync('../database/migrations/001_initial.sql')"
      - name: Build frontend
        run: docker build -t gks-frontend:ci gks_frontend
      - name: Check hosting Compose file and database certificate script
        run: |
          env_dir="$RUNNER_TEMP/gks-env"
          mkdir -p "$env_dir"
          scripts/hosting/make-db-cert.sh "$env_dir/db-tls"
          touch "$env_dir/backend.env" "$env_dir/postgres.env" "$env_dir/install.env"
          GKS_ENV_DIR="$env_dir" GKS_SITE_ADDRESS=gks.example.test docker compose -f compose.hosting.yaml --profile install config -q
